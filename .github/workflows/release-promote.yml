name: Promote Grok LHC release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fork release (<base> or <base>-lhc.<n>), matching the candidate"
        required: true
        type: string
      candidate_run_id:
        description: "Successful candidate run id"
        required: true
        type: string
      smoke_run_id:
        description: "Successful Linux smoke run id"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: grok-lhc-promote-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote exact qualified bytes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate and smoke identities
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SMOKE_RUN_ID: ${{ inputs.smoke_run_id }}
        run: |
          set -euo pipefail
          candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          smoke="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SMOKE_RUN_ID")"
          test "$(jq -r .conclusion <<<"$candidate")" = success
          test "$(jq -r .path <<<"$candidate")" = .github/workflows/release.yml
          test "$(jq -r .conclusion <<<"$smoke")" = success
          test "$(jq -r .path <<<"$smoke")" = .github/workflows/release-smoke.yml
          source_sha="$(jq -r .head_sha <<<"$candidate")"
          test "$source_sha" = "$(jq -r .head_sha <<<"$smoke")"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grok-lhc-v${{ inputs.version }}-candidate
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grok-lhc-qualification-${{ inputs.candidate_run_id }}
          path: qualification
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.smoke_run_id }}
      - name: Reverify exact candidate and manifest
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("candidate/release-manifest.json").read_text())
          assert manifest["release_version"] == os.environ["VERSION"]
          assert manifest["upstream_version"] == os.environ["VERSION"].split("-lhc.")[0]
          assert manifest["candidate_run_id"] == os.environ["CANDIDATE_RUN_ID"]
          assert manifest["source_commit"] == os.environ["SOURCE_SHA"]
          platforms = ["linux-x86_64", "darwin-aarch64", "windows-x86_64"]
          assert manifest["published_platforms"] == platforms
          assert [item["platform"] for item in manifest["artifacts"] if "platform" in item] == platforms
          # Exactly the seven published files: three executables, both installers, manifest, checksums.
          assert {item["path"] for item in manifest["artifacts"]} == {
              f"grok-{os.environ['VERSION']}-linux-x86_64",
              f"grok-{os.environ['VERSION']}-darwin-aarch64",
              f"grok-{os.environ['VERSION']}-windows-x86_64.exe",
              "install.sh",
              "install.ps1",
          }
          assert {p.name for p in Path("candidate").iterdir()} == {item["path"] for item in manifest["artifacts"]} | {
              "release-manifest.json", "SHA256SUMS"
          }
          evidence = json.loads(Path("qualification/qualification.json").read_text())
          assert evidence == {
              "candidate_run_id": os.environ["CANDIDATE_RUN_ID"],
              "version": os.environ["VERSION"],
              "result": "passed",
              "platform": "linux-x86_64",
          }
          PY
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "tag v${VERSION} already exists" >&2
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > existing-releases.txt
          if grep -Fxq "v${VERSION}" existing-releases.txt; then
            echo "release v${VERSION} already exists" >&2
            exit 1
          fi
      - name: Write truthful release notes
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SMOKE_RUN_ID: ${{ inputs.smoke_run_id }}
        run: |
          schema="$(python3 -c 'import json; print(json.load(open("candidate/release-manifest.json"))["lhc_thread_schema"])')"
          upstream="$(python3 -c 'import json; print(json.load(open("candidate/release-manifest.json"))["upstream_version"])')"
          cat > RELEASE_NOTES.md <<EOF
          ## Grok-LHC v${VERSION}

          Fork release ${VERSION} of upstream Grok source ${upstream}
          (\`grok --version\` reports the upstream base; \`grok --lhc-version\`
          reports ${VERSION}). Built from the public grok-build source tree at
          that base, not from xAI's separately published binaries. Install or
          update with the bundled installers, which keep a managed store and a
          separate command (default \`grok-lhc\`) beside any stock Grok install:
          \`install.sh --download\` on Linux/macOS, \`install.ps1 -Download\` on
          Windows. A managed install updates itself with \`grok update\`
          (background updates only with \`[cli] auto_update = true\`).

          Prebuilt executables: Linux x86-64, macOS Apple Silicon (darwin-aarch64),
          Windows x86-64. Qualification of these exact bytes: the Linux binary
          passed the Daytona install, identity, default-on LHC
          prompt/assistant/turn persistence, uninstall, and data-preservation
          smoke; the macOS binary passed architecture/identity checks and the
          shell installer lifecycle on its build runner; the Windows binary
          passed architecture/identity checks, the isolated installer lifecycle,
          and a native \`grok update\` against local release assets on its build
          runner. Interactive use on real machines is post-publication burn-in.
          Binaries are not code-signed or notarized (macOS Gatekeeper and Windows
          SmartScreen may warn on browser downloads; the installers use direct
          downloads).

          LHC changes since 0.3.1: compacted history is no longer re-captured
          into the transcript after a compact (1A), and long tool-driven turns
          are segmented LHC-side so compaction can cut inside a running task
          (1B; a segment holding only tool traffic compresses to an empty
          detailed-band entry, older huge turns are not split retrospectively).

          Candidate run: ${CANDIDATE_RUN_ID}
          Linux smoke run: ${SMOKE_RUN_ID}
          LHC thread schema: v${schema}

          This is not an official xAI release. Verify SHA256SUMS and
          release-manifest.json before installation.
          EOF
      - name: Publish without rebuilding
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: v${{ inputs.version }}
          name: Grok-LHC v${{ inputs.version }}
          target_commitish: ${{ steps.identity.outputs.source_sha }}
          body_path: RELEASE_NOTES.md
          files: |
            candidate/grok-*-linux-x86_64
            candidate/grok-*-darwin-aarch64
            candidate/grok-*-windows-x86_64.exe
            candidate/install.sh
            candidate/install.ps1
            candidate/release-manifest.json
            candidate/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: false
