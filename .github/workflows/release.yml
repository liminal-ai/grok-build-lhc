# Build one immutable Grok-LHC candidate: Linux x86-64, macOS Apple Silicon, and
# Windows x86-64 executables plus both installers, every platform required and
# verified on its own build runner. This workflow cannot publish.
name: Grok LHC candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fork release without the v prefix: <upstream base> (fork revision 0) or <base>-lhc.<n>; must equal lhc-release/VERSION"
        required: true
        type: string
      candidate_sha:
        description: "Full CANDIDATE_HANDOFF source SHA"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: grok-lhc-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  cheap-gates:
    name: Candidate handoff and packaging gates
    # The tripwire needs cargo + rustfmt and a protoc: rustup on this image installs
    # the pinned 1.94.0 toolchain (rust-toolchain.toml, rustfmt component) on first
    # use, and bin/protoc (dotslash, installed below) fetches protoc. No apt or
    # rust-toolchain step is required: this exact runner ran the tripwire fresh in
    # 4m17s (run 33866966760, 2026-09-04) and 4m25s / 5m35s in the two runs before,
    # all under the 15-minute timeout with the same job setup.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Validate CANDIDATE_HANDOFF identity
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-lhc\.[0-9]+)?$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          # Identity pair: the fork release is built on the native upstream base and is the embedded identity.
          test "$(tr -d '[:space:]' < lhc-release/VERSION)" = "$VERSION"
          upstream="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/codegen/xai-grok-version/Cargo.toml | head -n 1)"
          test "${VERSION%%-lhc.*}" = "$upstream"
          test -s SOURCE_REV
          test -s patches/BASE
          test -f crates/lhc/vendor/long-horizon-context/packages/lhc-rs/Cargo.toml
          test -z "$(git status --porcelain --ignore-submodules=none)"
      - name: Test shell installer lifecycle
        run: python3 scripts/grok-lhc-release/test_install.py
      - name: Check release Python and shell files
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/grok-lhc-release/*.py scripts/daytona-smoke/*.py
          sh -n scripts/grok-lhc-release/install.sh
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Run authoritative fork tripwire
        run: ./scripts/check-lhc-hooks.sh

  build-linux:
    name: Build linux-x86_64
    needs: cheap-gates
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake protobuf-compiler
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.94.0"
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Build and identify release binary
        env:
          LHC_RELEASE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Native GROK_VERSION is the upstream base; the fork release is embedded from lhc-release/VERSION.
          upstream="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/codegen/xai-grok-version/Cargo.toml | head -n 1)"
          test "${LHC_RELEASE%%-lhc.*}" = "$upstream"
          test "$(tr -d '[:space:]' < lhc-release/VERSION)" = "$LHC_RELEASE"
          GROK_VERSION="$upstream" cargo build --locked -p xai-grok-pager-bin --release
          asset="grok-${LHC_RELEASE}-linux-x86_64"
          install -m 0755 target/release/xai-grok-pager "$asset"
          strip "$asset"
          file "$asset" | grep -F "x86-64"
          "./$asset" --version | grep -F "grok ${upstream}"
          test "$("./$asset" --lhc-version)" = "$LHC_RELEASE"
          "./$asset" --help >/dev/null
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grok-lhc-linux-x86_64
          path: grok-${{ inputs.version }}-linux-x86_64
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build darwin-aarch64
    needs: cheap-gates
    # The platform-readiness route (proven 2026-09-01): toolchain + dotslash, no brew.
    runs-on: blacksmith-12vcpu-macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.94.0"
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Build and identify release binary
        env:
          LHC_RELEASE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          upstream="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/codegen/xai-grok-version/Cargo.toml | head -n 1)"
          test "${LHC_RELEASE%%-lhc.*}" = "$upstream"
          test "$(tr -d '[:space:]' < lhc-release/VERSION)" = "$LHC_RELEASE"
          GROK_VERSION="$upstream" cargo build --locked -p xai-grok-pager-bin --release
          asset="grok-${LHC_RELEASE}-darwin-aarch64"
          install -m 0755 target/release/xai-grok-pager "$asset"
          file "$asset" | grep -F "arm64"
          "./$asset" --version | grep -F "grok ${upstream}"
          test "$("./$asset" --lhc-version)" = "$LHC_RELEASE"
          "./$asset" --help >/dev/null
      - name: Exercise the shell installer with the built asset
        env:
          LHC_RELEASE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          asset="grok-${LHC_RELEASE}-darwin-aarch64"
          rel="$RUNNER_TEMP/release"; prefix="$RUNNER_TEMP/prefix"; store="$RUNNER_TEMP/store"; data="$RUNNER_TEMP/lhc-data"
          mkdir -p "$rel" "$data"; echo archive > "$data/keep"
          cp "$asset" "$rel/$asset"
          printf '{\n  "product": "grok-lhc",\n  "release_version": "%s"\n}\n' "$LHC_RELEASE" > "$rel/release-manifest.json"
          (cd "$rel" && shasum -a 256 "$asset" > SHA256SUMS)
          sh scripts/grok-lhc-release/install.sh --version "$LHC_RELEASE" --asset-dir "$rel" --name grok-lhc-check --prefix "$prefix" --install-root "$store"
          test "$("$prefix/bin/grok-lhc-check" --lhc-version)" = "$LHC_RELEASE"
          "$prefix/bin/grok-lhc-check" --version | grep -F "grok ${LHC_RELEASE%%-lhc.*}"
          test "$(cat "$store/installed-name")" = grok-lhc-check
          test "$(cat "$store/installed-version")" = "$LHC_RELEASE"
          test "$(cat "$store/installed-prefix")" = "$prefix"
          test "$(readlink "$store/current")" = "$store/versions/$LHC_RELEASE"
          cmp "$store/current/bin/grok" "$asset"
          sh scripts/grok-lhc-release/install.sh --uninstall --install-root "$store"
          test ! -e "$prefix/bin/grok-lhc-check"
          test ! -e "$store"
          test "$(cat "$data/keep")" = archive
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grok-lhc-darwin-aarch64
          path: grok-${{ inputs.version }}-darwin-aarch64
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build windows-x86_64
    needs: cheap-gates
    # GitHub-hosted, as v0.2.0 and platform-readiness were. protoc comes from
    # chocolatey (the platform-readiness route, proven 2026-09-01); PROTOC is
    # unset, so xai-proto-build finds it on PATH.
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.94.0"
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Install Windows protoc
        shell: pwsh
        run: choco install protoc --no-progress -y
      - name: Build and identify release binary
        shell: pwsh
        env:
          LHC_RELEASE: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $upstream = (Select-String -Path crates/codegen/xai-grok-version/Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (($env:LHC_RELEASE -replace '-lhc\.\d+$', '') -ne $upstream) { throw "release $env:LHC_RELEASE is not built on upstream $upstream" }
          if ((Get-Content lhc-release/VERSION -Raw).Trim() -ne $env:LHC_RELEASE) { throw "lhc-release/VERSION is not $env:LHC_RELEASE" }
          $env:GROK_VERSION = $upstream
          cargo build --locked -p xai-grok-pager-bin --release
          if ($LASTEXITCODE) { throw "cargo build failed: $LASTEXITCODE" }
          Copy-Item target/release/xai-grok-pager.exe "grok-$env:LHC_RELEASE-windows-x86_64.exe"
      - name: Test Windows installer lifecycle (fixture binary)
        shell: pwsh
        run: ./scripts/grok-lhc-release/test_install.ps1
      - name: Verify the candidate executable, installer, and native update on this runner
        shell: pwsh
        env:
          LHC_RELEASE: ${{ inputs.version }}
        run: ./scripts/grok-lhc-release/candidate_check.ps1 -Exe "grok-$env:LHC_RELEASE-windows-x86_64.exe" -Version $env:LHC_RELEASE
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grok-lhc-windows-x86_64
          path: grok-${{ inputs.version }}-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 14

  candidate:
    name: Assemble immutable candidate
    needs: [build-linux, build-macos, build-windows]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grok-lhc-linux-x86_64
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grok-lhc-darwin-aarch64
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grok-lhc-windows-x86_64
          path: candidate
      - name: Generate manifest and checksums before smoke
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          install -m 0755 scripts/grok-lhc-release/install.sh candidate/install.sh
          install -m 0644 scripts/grok-lhc-release/install.ps1 candidate/install.ps1
          test -f "candidate/grok-$VERSION-linux-x86_64"
          test -f "candidate/grok-$VERSION-darwin-aarch64"
          test -f "candidate/grok-$VERSION-windows-x86_64.exe"
          upstream="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/codegen/xai-grok-version/Cargo.toml | head -n 1)"
          python3 scripts/grok-lhc-release/make_manifest.py \
            --dist candidate \
            --version "$VERSION" \
            --upstream-version "$upstream" \
            --source-commit "$(git rev-parse HEAD)" \
            --source-revision "$(tr -d '[:space:]' < SOURCE_REV)" \
            --upstream-commit "$(tr -d '[:space:]' < patches/BASE)" \
            --lhc-sdk-commit "$(git -C crates/lhc/vendor/long-horizon-context rev-parse HEAD)" \
            --tripwire-evidence "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-id "$GITHUB_RUN_ID"
          (cd candidate && sha256sum -c SHA256SUMS)
          python3 -m json.tool candidate/release-manifest.json >/dev/null
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grok-lhc-v${{ inputs.version }}-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
