# Build one immutable Grok-LHC Linux candidate. This workflow cannot publish.
name: Grok LHC candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the v prefix"
        required: true
        type: string
      candidate_sha:
        description: "Full CANDIDATE_HANDOFF source SHA"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: grok-lhc-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  cheap-gates:
    name: Candidate handoff and packaging gates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Validate CANDIDATE_HANDOFF identity
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -s SOURCE_REV
          test -s patches/BASE
          test -f crates/lhc/vendor/long-horizon-context/packages/lhc-rs/Cargo.toml
          test -z "$(git status --porcelain --ignore-submodules=none)"
      - name: Test Linux installer lifecycle
        run: python3 scripts/grok-lhc-release/test_install.py
      - name: Check release Python and shell files
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/grok-lhc-release/*.py scripts/daytona-smoke/*.py
          sh -n scripts/grok-lhc-release/install.sh
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Run authoritative fork tripwire
        run: ./scripts/check-lhc-hooks.sh

  build-linux:
    name: Build linux-x86_64
    needs: cheap-gates
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake protobuf-compiler
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.94.0"
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Build and identify release binary
        env:
          GROK_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo build --locked -p xai-grok-pager-bin --release
          install -m 0755 target/release/xai-grok-pager "grok-${GROK_VERSION}-linux-x86_64"
          strip "grok-${GROK_VERSION}-linux-x86_64"
          "./grok-${GROK_VERSION}-linux-x86_64" --version | grep -F "grok ${GROK_VERSION}"
          "./grok-${GROK_VERSION}-linux-x86_64" --help >/dev/null
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grok-lhc-linux-x86_64
          path: grok-${{ inputs.version }}-linux-x86_64
          if-no-files-found: error
          retention-days: 14

  candidate:
    name: Assemble immutable candidate
    needs: build-linux
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grok-lhc-linux-x86_64
          path: candidate
      - name: Generate manifest and checksums before smoke
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          install -m 0755 scripts/grok-lhc-release/install.sh candidate/install.sh
          python3 scripts/grok-lhc-release/make_manifest.py \
            --dist candidate \
            --version "$VERSION" \
            --source-commit "$(git rev-parse HEAD)" \
            --source-revision "$(tr -d '[:space:]' < SOURCE_REV)" \
            --upstream-commit "$(tr -d '[:space:]' < patches/BASE)" \
            --lhc-sdk-commit "$(git -C crates/lhc/vendor/long-horizon-context rev-parse HEAD)" \
            --tripwire-evidence "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-id "$GITHUB_RUN_ID"
          (cd candidate && sha256sum -c SHA256SUMS)
          python3 -m json.tool candidate/release-manifest.json >/dev/null
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grok-lhc-v${{ inputs.version }}-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
