[package]
license = "Apache-2.0"
name = "xai-grok-update"
version = "0.1.220-alpha.4"
edition.workspace = true

[dependencies]
sha2 = { workspace = true }
dunce = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
indicatif = { workspace = true }
reqwest = { workspace = true }
xai-grok-extra-ca = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "process", "io-util", "macros", "time"] }
tracing = { workspace = true }
url = { workspace = true }
xai-dirs = { workspace = true }
xai-grok-shell = { workspace = true }
xai-grok-telemetry = { workspace = true }
xai-grok-tools = { workspace = true }
xai-grok-version = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[features]
# Fork (test-only seam): lets tests route the updater through upstream's stock
# installer kinds via `GROK_INSTALLER` and pin the managed-store lookup via
# `GROK_LHC_TEST_EXE`. Never enabled in a shipping build.
lhc-test-seams = []

[dev-dependencies]
xai-grok-update = { path = ".", features = ["lhc-test-seams"] }
semver = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }
